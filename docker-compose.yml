# MoneyTrack — production (Coolify / Docker)
# All secrets come from Coolify Environment Variables (root .env).
# Do NOT rely on server/.env — that file is gitignored and missing on deploy.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moneytrack}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify env}
    expose:
      - "5432"
    volumes:
      - moneytrack_pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ./server
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-moneytrack}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify env}
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  client:
    build:
      context: ./client
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  moneytrack_pgdata:
